---
- name: Detect where the chart put the replication controller
  ansible.builtin.include_tasks:
    file: detect_repl_ns.yml
    apply:
      tags: [k7, k8]

- name: Verify each cluster
  ansible.builtin.include_tasks:
    file: verify_site.yml
    apply:
      tags: [k7, k8]
  loop: "{{ site_list }}"
  loop_control:
    loop_var: site
    label: "{{ site.id }}"
