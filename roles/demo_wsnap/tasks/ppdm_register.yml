---
# Registers the Kubernetes cluster in PPDM and creates the protection policy (--tags register; needs -e demo_wsnap_ppdm_automate=true
# -e confirm_ppdm_changes=yes). Uses the fjacquet.ppdm collection (workflow of bottkars/ansible_ppdm 130.1 add K8s, 130.2 policy; v3 policy body of the PPDM 20.3 OpenAPI).
# Needs the PPDM RBAC archive (PPDM UI: Downloads > Kubernetes > RBAC) extracted in demo_wsnap_ppdm_rbac_dir. Each step reuses what exists.
# The modules are not validated against a live PPDM upstream for these calls, and this role has not run against one either. Asset type "KUBERNETES" for the namespace lookup is to confirm.
- name: PPDM registration and policy
  vars:
    _pw: "{{ demo_wsnap_ppdm_password | default(lookup('ansible.builtin.env', 'PPDM_PASSWORD', default='')) }}"
    _cred_name: "ppdm-discovery-{{ demo_wsnap_k8s_api_fqdn }}"
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ demo_wsnap_ppdm_host }}"
      username: "{{ demo_wsnap_ppdm_user }}"
      password: "{{ _pw }}"
      validate_certs: "{{ not (skip_cert_validation | bool) }}"
  block:
    - name: Require the flag, the confirmation and the lab inputs
      ansible.builtin.assert:
        that:
          - demo_wsnap_ppdm_automate | bool
          - confirm_ppdm_changes | default('no') == 'yes'
          - demo_wsnap_ppdm_host | length > 0
          - not (demo_wsnap_ppdm_host is search('example\\.com$'))
          - demo_wsnap_ppdm_policy | length > 0
          - demo_wsnap_ppdm_datadomain | length > 0
          - demo_wsnap_k8s_api_fqdn | length > 0
          - demo_wsnap_ppdm_rbac_dir | length > 0
        fail_msg: >-
          Registration needs a real PPDM host (the placeholder *.example.com is refused: the password would be sent to it) and -e demo_wsnap_ppdm_automate=true -e confirm_ppdm_changes=yes and the lab values demo_wsnap_ppdm_host,
          demo_wsnap_ppdm_policy, demo_wsnap_ppdm_datadomain, demo_wsnap_k8s_api_fqdn, demo_wsnap_ppdm_rbac_dir (platform.yml) plus the password
          (demo_wsnap_ppdm_password or PPDM_PASSWORD).
        quiet: true

    - name: Check the PPDM RBAC files
      ansible.builtin.stat:
        path: "{{ demo_wsnap_ppdm_rbac_dir }}/{{ item }}"
      register: demo_wsnap_rbac_files
      loop: [ppdm-controller-rbac.yaml, ppdm-discovery.yaml]

    - name: Assert the RBAC files are there
      ansible.builtin.assert:
        that: demo_wsnap_rbac_files.results | map(attribute='stat.exists') | min
        fail_msg: "Extract the RBAC archive (PPDM UI: Downloads > Kubernetes > RBAC) into {{ demo_wsnap_ppdm_rbac_dir }}: ppdm-controller-rbac.yaml and ppdm-discovery.yaml are expected."
        quiet: true

    - name: Apply the PPDM RBAC on the cluster
      ansible.builtin.command: >-
        {{ demo_wsnap_kubectl }} apply -f {{ demo_wsnap_ppdm_rbac_dir }}/{{ item }}
      loop: [ppdm-controller-rbac.yaml, ppdm-discovery.yaml]
      register: demo_wsnap_rbac_applied
      changed_when: "'created' in demo_wsnap_rbac_applied.stdout or 'configured' in demo_wsnap_rbac_applied.stdout"

    - name: Directory for the rendered manifests
      ansible.builtin.file:
        path: "{{ dr_dir }}/writable"
        state: directory
        mode: "0700"

    - name: Render the discovery token Secret (needed since Kubernetes 1.24)
      ansible.builtin.template:
        src: ppdm_token_secret.yaml.j2
        dest: "{{ dr_dir }}/writable/ppdm-token-secret.yaml"
        mode: "0600"

    - name: Apply the discovery token Secret
      ansible.builtin.command: >-
        {{ demo_wsnap_kubectl }} apply -f {{ dr_dir }}/writable/ppdm-token-secret.yaml
      register: demo_wsnap_secret_applied
      changed_when: "'created' in demo_wsnap_secret_applied.stdout or 'configured' in demo_wsnap_secret_applied.stdout"

    - name: Read the discovery token
      ansible.builtin.command: >-
        {{ demo_wsnap_kubectl }} -n {{ demo_wsnap_ppdm_sa_ns }} get secret ppdm-discovery-serviceaccount-token -o jsonpath={.data.token}
      register: demo_wsnap_sa_token
      changed_when: false
      no_log: true
      retries: 10
      delay: 3
      until: demo_wsnap_sa_token.stdout | length > 0

    - name: Ensure the Kubernetes credential from the service account token
      fjacquet.ppdm.credential:
        name: "{{ _cred_name }}"
        type: KUBERNETES
        method: TOKEN
        cred_username: "{{ _cred_name }}"
        cred_password: "{{ demo_wsnap_sa_token.stdout | b64decode }}"
      register: demo_wsnap_cred
      no_log: true

    # Lab behaviour kept: the certificate PPDM fetches from the API server is trusted as presented (the old code did the same).
    # shortcut: no fingerprint pin, add one (fingerprint:) for a customer environment.
    - name: Trust the certificate of the Kubernetes API server
      fjacquet.ppdm.certificate:
        host: "{{ demo_wsnap_k8s_api_fqdn }}"
        host_port: "{{ demo_wsnap_k8s_api_port | int }}"
        accept_any_certificate: true

    - name: Ensure the Kubernetes cluster as an asset source
      fjacquet.ppdm.inventory_source:
        name: "{{ demo_wsnap_k8s_api_fqdn }}"
        type: KUBERNETES
        address: "{{ demo_wsnap_k8s_api_fqdn }}"
        source_port: "{{ demo_wsnap_k8s_api_port | int }}"
        credential_id: "{{ demo_wsnap_cred.credential.id }}"
        config:
          vendor: KUBERNETES

    - name: Discover the cluster
      fjacquet.ppdm.discovery:
        inventory_source: "{{ demo_wsnap_k8s_api_fqdn }}"
        level: DataCopies
        ignore_running: true

    - name: Wait for the protected namespace to be discovered
      fjacquet.ppdm.asset_info:
        name: "{{ demo_wsnap_protected_ns }}"
        asset_type: KUBERNETES
      register: demo_wsnap_assets
      retries: 20
      delay: 15
      until: demo_wsnap_assets.assets | length > 0

    - name: Find the Data Domain storage system
      fjacquet.ppdm.storage_system_info:
        name: "{{ demo_wsnap_ppdm_datadomain }}"
      register: demo_wsnap_storage

    - name: Assert the Data Domain is declared in PPDM
      ansible.builtin.assert:
        that: demo_wsnap_storage.storage_systems | length == 1
        fail_msg: "Data Domain '{{ demo_wsnap_ppdm_datadomain }}' is not a storage system of this PPDM: add it in PPDM first."
        quiet: true

    # PPDM 20.3 wants a UUID id on each objective, operation and retention: derived from the policy name, so a re-run sends the same ids.
    - name: Ensure the Kubernetes protection policy (on demand, full backup, one day of retention)
      fjacquet.ppdm.protection_policy:
        name: "{{ demo_wsnap_ppdm_policy }}"
        asset_type: KUBERNETES
        description: Writable snapshot demo policy
        purpose: CENTRALIZED
        objectives:
          - id: "{{ (demo_wsnap_ppdm_policy ~ '-objective') | ansible.builtin.to_uuid }}"
            type: BACKUP
            operations:
              - id: "{{ (demo_wsnap_ppdm_policy ~ '-operation') | ansible.builtin.to_uuid }}"
                backupLevel: FULL
                triggerType: ON_DEMAND
            retentions:
              - id: "{{ (demo_wsnap_ppdm_policy ~ '-retention') | ansible.builtin.to_uuid }}"
                time:
                  - type: RETENTION
                    unitType: DAY
                    unitValue: 1
            target:
              storageTargetId: "{{ demo_wsnap_storage.storage_systems[0].id }}"

    - name: Assign the namespace to the policy
      fjacquet.ppdm.protection_policy_assets:
        policy: "{{ demo_wsnap_ppdm_policy }}"
        asset_ids: "{{ demo_wsnap_assets.assets | map(attribute='id') | list }}"
