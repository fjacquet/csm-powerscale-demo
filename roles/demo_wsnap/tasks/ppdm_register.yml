---
# Registers the Kubernetes cluster in PPDM and creates the protection policy (--tags register; needs -e demo_wsnap_ppdm_automate=true
# -e confirm_ppdm_changes=yes). Adapted from https://github.com/bottkars/ansible_ppdm (130.1 add K8s, 130.2 policy) at commit
# f66c9fa7246c2b9c1e59140213c41adc3e163bdb, with the v3 policy body of the PPDM 20.3 OpenAPI (bottkars' body is the older `stages` format).
# Needs the PPDM RBAC archive (PPDM UI: Downloads > Kubernetes > RBAC) extracted in demo_wsnap_ppdm_rbac_dir. Each step reuses what exists.
# The request bodies follow the 20.3 OpenAPI and bottkars; they have not run against a PPDM yet. Asset type "KUBERNETES" for the namespace lookup is to confirm.
- name: PPDM registration and policy
  vars:
    _headers:
      Authorization: "Bearer {{ demo_wsnap_ppdm_token | default('') }}"
    _cred_name: "ppdm-discovery-{{ demo_wsnap_k8s_api_fqdn }}"
    _protected_ns: "{{ demo_wsnap_protected_ns }}"
  block:
    - name: Require the flag, the confirmation and the lab inputs
      ansible.builtin.assert:
        that:
          - demo_wsnap_ppdm_automate | bool
          - confirm_ppdm_changes | default('no') == 'yes'
          - demo_wsnap_ppdm_host | length > 0
          - demo_wsnap_ppdm_policy | length > 0
          - demo_wsnap_ppdm_datadomain | length > 0
          - demo_wsnap_k8s_api_fqdn | length > 0
          - demo_wsnap_ppdm_rbac_dir | length > 0
        fail_msg: >-
          Registration needs -e demo_wsnap_ppdm_automate=true -e confirm_ppdm_changes=yes and the lab values demo_wsnap_ppdm_host,
          demo_wsnap_ppdm_policy, demo_wsnap_ppdm_datadomain, demo_wsnap_k8s_api_fqdn, demo_wsnap_ppdm_rbac_dir (platform.yml) plus the password
          (demo_wsnap_ppdm_password or PPDM_PASSWORD).
        quiet: true

    - name: Check the PPDM RBAC files
      ansible.builtin.stat:
        path: "{{ demo_wsnap_ppdm_rbac_dir }}/{{ item }}"
      register: demo_wsnap_rbac_files
      loop: [ppdm-controller-rbac.yaml, ppdm-discovery.yaml]

    - name: Assert the RBAC files are there
      ansible.builtin.assert:
        that: demo_wsnap_rbac_files.results | map(attribute='stat.exists') | min
        fail_msg: "Extract the RBAC archive (PPDM UI: Downloads > Kubernetes > RBAC) into {{ demo_wsnap_ppdm_rbac_dir }}: ppdm-controller-rbac.yaml and ppdm-discovery.yaml are expected."
        quiet: true

    - name: Apply the PPDM RBAC on the cluster
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ demo_wsnap_site.kubeconfig }} apply -f {{ demo_wsnap_ppdm_rbac_dir }}/{{ item }}
      loop: [ppdm-controller-rbac.yaml, ppdm-discovery.yaml]
      register: demo_wsnap_rbac_applied
      changed_when: "'created' in demo_wsnap_rbac_applied.stdout or 'configured' in demo_wsnap_rbac_applied.stdout"

    - name: Render the discovery token Secret (needed since Kubernetes 1.24)
      ansible.builtin.template:
        src: ppdm_token_secret.yaml.j2
        dest: "{{ dr_dir }}/writable/ppdm-token-secret.yaml"
        mode: "0600"

    - name: Apply the discovery token Secret
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ demo_wsnap_site.kubeconfig }} apply -f {{ dr_dir }}/writable/ppdm-token-secret.yaml
      register: demo_wsnap_secret_applied
      changed_when: "'created' in demo_wsnap_secret_applied.stdout or 'configured' in demo_wsnap_secret_applied.stdout"

    - name: Read the discovery token
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ demo_wsnap_site.kubeconfig }} -n {{ demo_wsnap_ppdm_sa_ns }} get secret ppdm-discovery-serviceaccount-token -o jsonpath={.data.token}
      register: demo_wsnap_sa_token
      changed_when: false
      no_log: true
      retries: 10
      delay: 3
      until: demo_wsnap_sa_token.stdout | length > 0

    - name: Log in to PPDM
      ansible.builtin.include_tasks: ppdm_login.yml

    - name: Look for the Kubernetes credential
      ansible.builtin.uri:
        method: GET
        url: "https://{{ demo_wsnap_ppdm_host }}:8443/api/v2/credentials?filter=name%20eq%20%22{{ _cred_name | urlencode }}%22%20and%20type%20eq%20%22KUBERNETES%22"
        headers: "{{ _headers }}"
        validate_certs: "{{ not (skip_cert_validation | bool) }}"
        return_content: true
      register: demo_wsnap_cred_found
      no_log: true

    - name: Create the Kubernetes credential from the service account token
      ansible.builtin.uri:
        method: POST
        url: "https://{{ demo_wsnap_ppdm_host }}:8443/api/v2/credentials"
        headers: "{{ _headers }}"
        body_format: json
        body:
          method: TOKEN
          name: "{{ _cred_name }}"
          type: KUBERNETES
          username: "{{ _cred_name }}"
          password: "{{ demo_wsnap_sa_token.stdout | b64decode }}"
        status_code: [200, 201, 202]
        validate_certs: "{{ not (skip_cert_validation | bool) }}"
        return_content: true
      register: demo_wsnap_cred_created
      no_log: true
      when: demo_wsnap_cred_found.json.content | length == 0

    - name: Remember the credential id
      ansible.builtin.set_fact:
        demo_wsnap_cred_id: "{{ demo_wsnap_cred_found.json.content[0].id if demo_wsnap_cred_found.json.content | length > 0 else demo_wsnap_cred_created.json.id }}"

    - name: Get the certificate of the Kubernetes API server
      ansible.builtin.uri:
        method: GET
        url: "https://{{ demo_wsnap_ppdm_host }}:8443/api/v2/certificates?host={{ demo_wsnap_k8s_api_fqdn }}&port={{ demo_wsnap_k8s_api_port }}&type=Host"
        headers: "{{ _headers }}"
        validate_certs: "{{ not (skip_cert_validation | bool) }}"
        return_content: true
      register: demo_wsnap_cert
      no_log: true

    - name: Accept the certificate
      ansible.builtin.uri:
        method: PUT
        url: "https://{{ demo_wsnap_ppdm_host }}:8443/api/v2/certificates/{{ demo_wsnap_cert.json.id }}"
        headers: "{{ _headers }}"
        body_format: json
        body: "{{ demo_wsnap_cert.json | combine({'state': 'ACCEPTED'}) }}"
        status_code: [200, 202]
        validate_certs: "{{ not (skip_cert_validation | bool) }}"
      no_log: true
      when: demo_wsnap_cert.json.state | default('') != 'ACCEPTED'

    - name: Look for the Kubernetes asset source
      ansible.builtin.uri:
        method: GET
        url: "https://{{ demo_wsnap_ppdm_host }}:8443/api/v2/inventory-sources?filter=address%20eq%20%22{{ demo_wsnap_k8s_api_fqdn | urlencode }}%22%20and%20type%20eq%20%22KUBERNETES%22"
        headers: "{{ _headers }}"
        validate_certs: "{{ not (skip_cert_validation | bool) }}"
        return_content: true
      register: demo_wsnap_source_found
      no_log: true

    - name: Add the Kubernetes cluster as an asset source
      ansible.builtin.uri:
        method: POST
        url: "https://{{ demo_wsnap_ppdm_host }}:8443/api/v2/inventory-sources"
        headers: "{{ _headers }}"
        body_format: json
        body:
          name: "{{ demo_wsnap_k8s_api_fqdn }}"
          type: KUBERNETES
          vendor: KUBERNETES
          address: "{{ demo_wsnap_k8s_api_fqdn }}"
          port: "{{ demo_wsnap_k8s_api_port | int }}"
          credentials:
            id: "{{ demo_wsnap_cred_id }}"
        status_code: [200, 201, 202]
        validate_certs: "{{ not (skip_cert_validation | bool) }}"
        return_content: true
      register: demo_wsnap_source_created
      no_log: true
      when: demo_wsnap_source_found.json.content | length == 0

    - name: Remember the asset source id
      ansible.builtin.set_fact:
        demo_wsnap_source_id: "{{ demo_wsnap_source_found.json.content[0].id if demo_wsnap_source_found.json.content | length > 0 else demo_wsnap_source_created.json.id }}"

    - name: Start a discovery of the cluster
      ansible.builtin.uri:
        method: POST
        url: "https://{{ demo_wsnap_ppdm_host }}:8443/api/v2/discoveries"
        headers: "{{ _headers }}"
        body_format: json
        body:
          start: "/inventory-sources/{{ demo_wsnap_source_id }}"
          level: DataCopies
        status_code: [200, 202]
        validate_certs: "{{ not (skip_cert_validation | bool) }}"
      no_log: true

    - name: Wait for the protected namespace to be discovered
      ansible.builtin.uri:
        method: GET
        url: "https://{{ demo_wsnap_ppdm_host }}:8443/api/v2/assets?filter=name%20eq%20%22{{ _protected_ns | urlencode }}%22%20and%20type%20eq%20%22KUBERNETES%22"
        headers: "{{ _headers }}"
        validate_certs: "{{ not (skip_cert_validation | bool) }}"
        return_content: true
      register: demo_wsnap_assets
      no_log: true
      retries: 20
      delay: 15
      until: demo_wsnap_assets.json.content | length > 0

    - name: Find the Data Domain storage system
      ansible.builtin.uri:
        method: GET
        url: "https://{{ demo_wsnap_ppdm_host }}:8443/api/v2/storage-systems?filter=name%20eq%20%22{{ demo_wsnap_ppdm_datadomain | urlencode }}%22"
        headers: "{{ _headers }}"
        validate_certs: "{{ not (skip_cert_validation | bool) }}"
        return_content: true
      register: demo_wsnap_storage
      no_log: true

    - name: Assert the Data Domain is declared in PPDM
      ansible.builtin.assert:
        that: demo_wsnap_storage.json.content | length == 1
        fail_msg: "Data Domain '{{ demo_wsnap_ppdm_datadomain }}' is not a storage system of this PPDM: add it in PPDM first."
        quiet: true

    - name: Look for the protection policy
      ansible.builtin.uri:
        method: GET
        url: "https://{{ demo_wsnap_ppdm_host }}:8443/api/v3/protection-policies?filter=name%20eq%20%22{{ demo_wsnap_ppdm_policy | urlencode }}%22"
        headers: "{{ _headers }}"
        validate_certs: "{{ not (skip_cert_validation | bool) }}"
        return_content: true
      register: demo_wsnap_policy_found
      no_log: true

    - name: Create the Kubernetes protection policy (on demand, full backup, one day of retention)
      ansible.builtin.uri:
        method: POST
        url: "https://{{ demo_wsnap_ppdm_host }}:8443/api/v3/protection-policies"
        headers: "{{ _headers }}"
        body_format: json
        body:
          assetType: KUBERNETES
          name: "{{ demo_wsnap_ppdm_policy }}"
          description: Writable snapshot demo policy
          purpose: CENTRALIZED
          objectives:
            - type: BACKUP
              operations:
                - backupLevel: FULL
                  triggerType: ON_DEMAND
              retentions:
                - time:
                    - type: RETENTION
                      unitType: DAY
                      unitValue: 1
              target:
                storageTargetId: "{{ demo_wsnap_storage.json.content[0].id }}"
        status_code: [200, 201, 202]
        validate_certs: "{{ not (skip_cert_validation | bool) }}"
        return_content: true
      register: demo_wsnap_policy_created
      no_log: true
      when: demo_wsnap_policy_found.json.content | length == 0

    - name: Remember the policy id
      ansible.builtin.set_fact:
        demo_wsnap_policy_id: "{{ demo_wsnap_policy_found.json.content[0].id if demo_wsnap_policy_found.json.content | length > 0 else demo_wsnap_policy_created.json.id }}"

    - name: Assign the namespace to the policy
      ansible.builtin.uri:
        method: POST
        url: "https://{{ demo_wsnap_ppdm_host }}:8443/api/v2/protection-policies/{{ demo_wsnap_policy_id }}/asset-assignments"
        headers: "{{ _headers }}"
        body_format: json
        body: "{{ demo_wsnap_assets.json.content | map(attribute='id') | list }}"
        status_code: [200, 201, 202, 204]
        validate_certs: "{{ not (skip_cert_validation | bool) }}"
      no_log: true
