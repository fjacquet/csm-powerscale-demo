---
# Needs demo_wsnap_ppdm_host, the password and demo_wsnap_activity_id. Out: demo_wsnap_activity (state, result).
- name: Read the PPDM activity
  fjacquet.ppdm.activity_info:
    hostname: "{{ demo_wsnap_ppdm_host }}"
    username: "{{ demo_wsnap_ppdm_user }}"
    password: "{{ demo_wsnap_ppdm_password | default(lookup('ansible.builtin.env', 'PPDM_PASSWORD', default='')) }}"
    validate_certs: "{{ not (skip_cert_validation | bool) }}"
    id: "{{ demo_wsnap_activity_id }}"
  register: demo_wsnap_activity_call
  no_log: true

- name: Keep the activity state and result
  ansible.builtin.set_fact:
    demo_wsnap_activity: "{{ {'state': demo_wsnap_activity_call.activities[0].state, 'result': demo_wsnap_activity_call.activities[0].result | default({})} }}"
