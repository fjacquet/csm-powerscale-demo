---
# PPDM REST run (flag demo_wsnap_ppdm_automate). The cluster registration and the policy come from ppdm_register.yml (--tags register).
# Here: check that a Kubernetes cluster is registered, find the policy, take the array baseline, start the policy, remember the activity.
# Uses the fjacquet.ppdm collection (it logs in itself). The run stays on the api module: protection_policy_run needs asset or group ids
# and has no backupLevel, while this run targets the policy as is. Endpoint: POST /api/v3/protections (20.3 OpenAPI).
- name: PPDM REST automation
  when: demo_wsnap_ppdm_automate | bool
  vars:
    _pw: "{{ demo_wsnap_ppdm_password | default(lookup('ansible.builtin.env', 'PPDM_PASSWORD', default='')) }}"
  module_defaults:
    group/fjacquet.ppdm.ppdm:
      hostname: "{{ demo_wsnap_ppdm_host }}"
      username: "{{ demo_wsnap_ppdm_user }}"
      password: "{{ _pw }}"
      validate_certs: "{{ not (skip_cert_validation | bool) }}"
  block:
    - name: Require host, policy name and password
      ansible.builtin.assert:
        that:
          - demo_wsnap_ppdm_host | length > 0
          - not (demo_wsnap_ppdm_host is search('example\\.com$'))
          - demo_wsnap_ppdm_policy | length > 0
          - _pw | length > 0
          - confirm_ppdm_changes | default('no') == 'yes'
        fail_msg: >-
          Starting a PPDM backup needs -e confirm_ppdm_changes=yes, a real demo_wsnap_ppdm_host (the placeholder *.example.com is refused: the
          password would be sent to it), demo_wsnap_ppdm_policy and the password (demo_wsnap_ppdm_password or the environment variable PPDM_PASSWORD).
        quiet: true

    - name: List the registered Kubernetes clusters
      fjacquet.ppdm.inventory_source_info:
        filter: 'type eq "KUBERNETES"'
      register: demo_wsnap_k8s_clusters
      no_log: true

    - name: Assert a Kubernetes cluster is registered
      ansible.builtin.assert:
        that: demo_wsnap_k8s_clusters.inventory_sources | length > 0
        fail_msg: "No Kubernetes cluster is registered in PPDM: add the cluster as an asset source in the PPDM UI first."
        quiet: true

    - name: Find the protection policy by name
      fjacquet.ppdm.protection_policy_info:
        name: "{{ demo_wsnap_ppdm_policy }}"
      register: demo_wsnap_policies
      no_log: true

    - name: Assert the policy exists and has an objective
      ansible.builtin.assert:
        that:
          - demo_wsnap_policies.protection_policies | length == 1
          - demo_wsnap_policies.protection_policies[0].objectives | length > 0
        fail_msg: "Protection policy '{{ demo_wsnap_ppdm_policy }}' was not found (or has no objective). Create it in the PPDM UI for the Wiki.js namespace."
        quiet: true

    - name: Take the watched path and the array baseline before the job
      ansible.builtin.include_tasks: evidence_prepare.yml

    - name: Remember the job start
      ansible.builtin.set_fact:
        demo_wsnap_job_start: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Start the protection policy
      fjacquet.ppdm.api:
        method: POST
        path: /api/v3/protections
        body:
          policy:
            id: "{{ demo_wsnap_policies.protection_policies[0].id }}"
            objectives:
              - id: "{{ demo_wsnap_policies.protection_policies[0].objectives[0].id }}"
                operation:
                  backupLevel: FULL
      register: demo_wsnap_run
      no_log: true

    - name: Assert PPDM accepted the run
      ansible.builtin.assert:
        that: demo_wsnap_run.result.results[0].activityId is defined
        fail_msg: "PPDM rejected the run: status {{ demo_wsnap_run.result.results[0].status | default('?') }}, reason {{ demo_wsnap_run.result.results[0].reason | default('not given') }}."
        quiet: true

    - name: Remember the activity
      ansible.builtin.set_fact:
        demo_wsnap_activity_id: "{{ demo_wsnap_run.result.results[0].activityId }}"
