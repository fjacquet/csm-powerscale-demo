---
- name: Prepare fixture kubeconfigs
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create the fixture directory
      ansible.builtin.file:
        path: /tmp/molecule-common/kube
        state: directory
        mode: "0700"
    - name: Write kubeconfigs that point at the peer VMs
      ansible.builtin.copy:
        content: "apiVersion: v1\nclusters:\n- cluster:\n    server: https://{{ item.ip }}:6443\n"
        dest: "/tmp/molecule-common/kube/{{ item.id }}.yaml"
        mode: "0600"
      loop:
        - { id: primary, ip: 192.168.1.105 }
        - { id: secondary, ip: 192.168.1.107 }
