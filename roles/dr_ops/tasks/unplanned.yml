---
# D4: the primary is gone. Data since the last SyncIQ job (up to the RPO) can be lost.
- name: "Include the map (from the file, the primary API is unreachable)"
  ansible.builtin.include_tasks: load_map.yml

- name: Unplanned failover of each RG
  ansible.builtin.command: "repctl --rg {{ item }} failover --target secondary --unplanned"
  loop: "{{ dr_ops_selected | map(attribute='1') | unique | list }}"
  changed_when: true

- name: Record the DR state per namespace
  ansible.builtin.lineinfile:
    path: "{{ dr_dir }}/state"
    regexp: "^{{ item }} "
    line: "{{ item }} secondary-active"
    create: true
    mode: "0644"
  loop: "{{ dr_namespaces }}"

- name: RG status (errors reaching primary are expected)
  ansible.builtin.command: repctl get rg
  register: dr_ops_unplanned_rg
  changed_when: false
  failed_when: false

- name: Show it
  ansible.builtin.debug:
    var: dr_ops_unplanned_rg.stdout_lines
