---
- name: Replication CRDs exist
  kubernetes.core.k8s_info:
    kubeconfig: "{{ site.kubeconfig }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
  loop: "{{ site_list }}"
  loop_control:
    loop_var: site
    label: "{{ site.id }}"
  register: csm_ocp_crds

- name: Assert CRDs and the StorageClass prefix per cluster
  ansible.builtin.assert:
    that:
      - item.resources | map(attribute='metadata.name') | select('search', 'replication.storage.dell.com') | list | length > 0
    fail_msg: "No replication CRDs on {{ item.site.id }}: replication module not enabled in the ContainerStorageModule?"
    quiet: true
  loop: "{{ csm_ocp_crds.results }}"
  loop_control:
    label: "{{ item.site.id }}"

- name: Read the StorageClass on each cluster
  kubernetes.core.k8s_info:
    kubeconfig: "{{ site.kubeconfig }}"
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: isilon-replication
  loop: "{{ site_list }}"
  loop_control:
    loop_var: site
    label: "{{ site.id }}"
  register: csm_ocp_sc

- name: Assert the per-cluster volumeGroupPrefix
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].parameters[sc_param_prefix ~ '/volumeGroupPrefix'] == item.site.vg_prefix
    fail_msg: "isilon-replication on {{ item.site.id }} is missing or has the wrong volumeGroupPrefix."
    quiet: true
  loop: "{{ csm_ocp_sc.results }}"
  loop_control:
    label: "{{ item.site.id }}"
