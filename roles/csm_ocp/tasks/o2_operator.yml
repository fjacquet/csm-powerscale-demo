---
- name: Subscribe to the certified Dell CSM Operator (Manual approval, avoids unsupported auto-upgrades)
  kubernetes.core.k8s:
    kubeconfig: "{{ site.kubeconfig }}"
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: dell-csm-operator-certified
        namespace: "{{ ocp_operator_namespace }}"
      spec:
        channel: "{{ ocp_operator_channel }}"
        name: dell-csm-operator-certified
        source: certified-operators
        sourceNamespace: openshift-marketplace
        installPlanApproval: Manual
  loop: "{{ site_list }}"
  loop_control:
    loop_var: site
    label: "{{ site.id }}"

- name: Wait for the first InstallPlan
  kubernetes.core.k8s_info:
    kubeconfig: "{{ site.kubeconfig }}"
    api_version: operators.coreos.com/v1alpha1
    kind: InstallPlan
    namespace: "{{ ocp_operator_namespace }}"
  loop: "{{ site_list }}"
  loop_control:
    loop_var: site
    label: "{{ site.id }}"
  register: csm_ocp_plans
  until: csm_ocp_plans.resources | selectattr('spec.clusterServiceVersionNames', 'defined') | map(attribute='spec.clusterServiceVersionNames') | flatten | select('search', 'dell-csm-operator') | list | length > 0
  retries: 30
  delay: 10

- name: Approve the InstallPlan of the Dell operator
  kubernetes.core.k8s:
    kubeconfig: "{{ item.site.kubeconfig }}"
    state: patched
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: InstallPlan
      metadata:
        name: "{{ _plan.metadata.name }}"
        namespace: "{{ ocp_operator_namespace }}"
      spec:
        approved: true
  loop: "{{ csm_ocp_plans.results }}"
  loop_control:
    label: "{{ item.site.id }}"
  vars:
    _plan: "{{ item.resources | selectattr('spec.clusterServiceVersionNames', 'defined') | selectattr('spec.clusterServiceVersionNames', 'contains', 'dell-csm-operator') | first }}"
  when: not (_plan.spec.approved | default(false))

- name: Wait for the ClusterServiceVersion to succeed
  kubernetes.core.k8s_info:
    kubeconfig: "{{ site.kubeconfig }}"
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ ocp_operator_namespace }}"
  loop: "{{ site_list }}"
  loop_control:
    loop_var: site
    label: "{{ site.id }}"
  register: csm_ocp_csv
  until: csm_ocp_csv.resources | selectattr('metadata.name', 'search', 'dell-csm-operator') | selectattr('status.phase', 'defined') | selectattr('status.phase', 'eq', 'Succeeded') | list | length > 0
  retries: 40
  delay: 15
