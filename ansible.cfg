[defaults]
inventory = inventory/k3s
roles_path = roles
collections_path = collections
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = False
nocows = True
# shortcut: lab host keys are not pre-seeded; set True once known_hosts is populated.
host_key_checking = False

[ssh_connection]
pipelining = True
