---
# Management VM: where kubeconfigs, helm, dellctl, repctl, yq and kubectl live.
# Default = run Ansible ON the management VM (local connection).
# From a workstation instead: replace ansible_connection with ansible_host: 192.168.1.108 + ansible_user.
all:
  children:
    mgmt:
      hosts:
        mgmt_vm:
          ansible_connection: local
    # OneFS nodes (node 1 of each array). OneFS has no Python: only raw tasks run here.
    powerscale:
      hosts:
        ps1:
          ansible_host: 192.168.1.20
          peer_array: ps2
        ps2:
          ansible_host: 192.168.1.200
          peer_array: ps1
      vars:
        ansible_user: root
        ansible_python_interpreter: /bin/false
